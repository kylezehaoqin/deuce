[project]
name = "deuce"
version = "0.1.0"
description = "Natural-language analytics agent over shot-level tennis match-charting data."
readme = "README.md"
license = { text = "MIT" }
# dbt-core and dagster do not yet support 3.13+. Pinned deliberately; see .python-version.
requires-python = ">=3.11,<3.13"

dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.optional-dependencies]
# Increment 1 — the dbt/Dagster spine.
pipeline = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
]
# Increment 2-4 — the agent layer.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langfuse>=2.50",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
deuce = "deuce.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deuce"]

[tool.dagster]
# `dagster dev` discovers the code location from here, so it needs no arguments.
module_name = "deuce.orchestration"
code_location_name = "deuce"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# Ruff formats Python code blocks inside Markdown. The snippets in lessons/ and
# docs/ are FRAGMENTS, not modules -- `post_hook=[...]` is a keyword argument
# inside dbt's `{{ config(...) }}`, so `post_hook=[` is the correct rendering and
# ruff's `post_hook = [` would make the documentation wrong. Lint them, don't
# reformat them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
