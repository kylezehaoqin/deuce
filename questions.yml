# Tennis Analytics Agent — Eval / Demo / Mart-Spec Set
#
# Each entry does triple duty:
#   1. DEMO prompt   — what you'd type into the agent to show it off
#   2. MART spec     — the dbt models the answer requires (drives Layer 1)
#   3. EVAL case     — a regression test for the agent (drives Week-3 eval harness)
#
# SCORING (why it works before the data is even loaded):
#   Grade each answer on three axes.
#     a. query_correctness — does the generated SQL use the tables/filters/aggregation
#        in `reference_sql`? (rubric match — grade this from day one)
#     b. grounding         — does the answer cite the source rows / matches it used,
#        and refuse when the data can't support a claim? (grade from day one)
#     c. answer_correctness — does the value match `expected`? (fill `expected` ONCE by
#        hand-running reference_sql after the marts exist, then grade going forward)
#
#   Pre-data:  score a + b.   Post-data: score a + b + c.
#
# NOTE: table/column names below assume the staging + mart schema in
#   career-files-claude/08-data-eng-project-benchmarks.md. Reconcile names to the
#   ACTUAL schema once built — reference_sql is a grading rubric, not gospel.
#
# Data: Jeff Sackmann's Match Charting Project (CC BY-NC-SA 4.0 — attribution required).

meta:
  dataset: match-charting-project
  grain_note: "stg_shots = one row per shot; point/serve context columns joined from the point parse"
  difficulty_levels: [sql, sql+semantic, multi-step, guardrail]

questions:

  # TEMPLATES (D12): a question with {slots} is run once per filler. A filler
  # names its `kind` (deep, wta, left_handed, thin, name_variant, absent, ...),
  # its slot values, and what a correct answer `must_state`. `route` overrides
  # the question's label (an absent player -> refuse). Expanded by
  # src/deuce/evals/templates.py.

  # ─────────────── SERVE & SERVE+1 ───────────────
  - id: serve-02
    question: "After a wide serve on the deuce court, how often is the next shot a forehand into the open court, and does the server win those points?"
    category: serve
    difficulty: multi-step
    marts: [mart_serve_plus_one]
    needs_columns: [serve_direction, court_side, next_shot_type, next_shot_direction, point_winner]
    answer_shape: "A rate (serve+1 forehand to open court / all wide-deuce serves) and the point-win rate on that pattern."
    reference_sql: |
      -- rally_position = 2 (the serve+1), shot_type = 'forehand', direction = open court
      -- relative to serve; win rate = point_winner = server
      SELECT
        AVG((next_shot_type='forehand' AND next_shot_direction='open')::int) AS serve_plus_one_rate,
        AVG((point_winner='server')::int) FILTER (WHERE next_shot_type='forehand' AND next_shot_direction='open') AS win_rate
      FROM mart_serve_plus_one
      WHERE serve_direction='wide' AND court_side='deuce' AND player_id=:player;
    expected: TBD
    grounding: "cite matches; distinguish 'point ended on serve+1' vs 'pattern started the point'"

  - id: serve-03
    question: "Whose win rate falls fastest as rallies lengthen, and whose rises? Rank by slope, with at least 50 matches."
    category: serve
    difficulty: sql
    marts: [mart_rally_shape]
    needs_columns: [player_id, rally_length_bucket, point_winner]
    answer_shape: "Players ranked by win_rate_slope, both ends, with matches and slope_r2."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Rank by SLOPE, never by level: levels mostly reflect opponent quality."

  # ─────────────── RALLY SHAPE ───────────────
  - id: rally-01
    question: "Is {player} a first-striker on hard courts but a grinder on clay? Compare their rally-length slope by surface."
    category: rally
    difficulty: sql
    marts: [mart_rally_shape]
    needs_columns: [player_id, rally_length_bucket, point_winner]
    answer_shape: "win_rate_slope per surface, with points per surface."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "High+medium confidence only. A slope from few points is noise: state the n."
    fillers:
      - {"kind": "deep", "player": "Novak Djokovic"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "left_handed", "player": "Adrian Mannarino"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "the sample is thin (12 charted matches)"}
      - {"kind": "name_variant", "player": "Novak Djokovich", "must_state": "resolves the misspelling to Novak Djokovic"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}


  # ─────────────── DIRECTION & RISK ───────────────
  - id: direction-01
    question: "How often does {player} go down-the-line off the backhand, and is that shot +EV — or a highlight-reel trap with as many errors as winners?"
    category: direction
    difficulty: sql
    marts: [mart_shot_outcomes]
    needs_columns: [player_id, shot_type, direction, outcome]
    answer_shape: "DTL-backhand frequency + winner:error ratio on that shot; verdict on whether it nets positive."
    reference_sql: |
      SELECT
        AVG((direction='down_line')::int) FILTER (WHERE shot_type='backhand') AS dtl_rate,
        COUNT(*) FILTER (WHERE shot_type='backhand' AND direction='down_line' AND outcome='winner') AS winners,
        COUNT(*) FILTER (WHERE shot_type='backhand' AND direction='down_line' AND outcome='error')  AS errors
      FROM mart_shot_outcomes WHERE player_id=:player;
    expected: TBD
    grounding: "cite counts; state that 'forced' vs 'unforced' errors are treated together/separately"
    fillers:
      - {"kind": "deep", "player": "Novak Djokovic"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "left_handed", "player": "Adrian Mannarino"}
      - {"kind": "left_handed_deep", "player": "Rafael Nadal"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "the sample is thin (12 charted matches)"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  - id: direction-02
    question: "How often do pros aim groundstrokes at the opponent's backhand, and does it win them more points?"
    category: direction
    difficulty: multi-step
    marts: [mart_player_style, mart_matchup, dim_players]
    needs_columns: [player_id, target_wing, point_winner]
    answer_shape: "Share of directed drives to the backhand wing (direction + both players' handedness), per player; the win-rate part named as unanswerable."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Partial (D8): the share is answerable; win rate by target needs fct_shots. The denominator is directed drives."

  - id: direction-03
    question: "Who changes the direction of the ball most often (redirects pace) versus hits it back where it came from?"
    category: direction
    difficulty: sql
    marts: [mart_shot_outcomes]
    needs_columns: [player_id, incoming_direction, outgoing_direction]
    answer_shape: "Leaderboard of direction-change rate — a proxy for aggression + risk appetite."
    reference_sql: |
      SELECT player_id,
             AVG((incoming_direction <> outgoing_direction)::int) AS direction_change_rate
      FROM mart_shot_outcomes GROUP BY player_id ORDER BY 2 DESC;
    expected: TBD
    grounding: "min-shot threshold; cite"

  # ─────────────── PRESSURE & MOMENTUM ───────────────
  - id: pressure-01
    question: "On break point, which servers change their first- and second-serve placement most from their usual pattern, and does the change win them more points?"
    category: pressure
    difficulty: multi-step
    marts: [fct_serves, mart_serve_patterns]
    needs_columns: [player_id, is_break_point, serve_direction, serve_number, double_fault]
    answer_shape: "Per server and serve number: placement shares and entropy on break point vs other points, and win rate behind each, with n."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Placement, not speed: speed is not charted. Break point is a coarse flag; leverage is the finer one."

  - id: pressure-02
    question: "After winning a long rally, does a player win the next point more often, holding the server constant?"
    category: pressure
    difficulty: multi-step
    marts: [fct_points]
    needs_columns: [match_id, point_index, rally_length, point_winner]
    answer_shape: "Next-point win rate after long vs short rallies, split by who served, with n."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "T2 refutes only this narrow, next-point form. It does not refute momentum built over many points or seen in shot choice (see T11)."

  - id: pressure-03
    question: "Is the let-down game real? How often is a player broken straight back after breaking, compared with their own normal hold rate?"
    category: pressure
    difficulty: multi-step
    marts: [fct_games]
    needs_columns: [match_id, game_index, server, was_break, next_game_was_break]
    answer_shape: "Hold rate in the game right after breaking vs the overall hold rate, per tour, with n."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "The baseline is the PLAYER'S OWN hold rate, not the tour's: a player who just broke is often the weaker server (T8). Tiebreaks excluded."

  # ─────────────── MATCHUP / SCOUTING ───────────────
  - id: matchup-01
    question: "What are {player}'s most predictable patterns, and how could an opponent exploit them?"
    category: matchup
    difficulty: multi-step
    marts: [mart_serve_patterns, mart_player_style]
    needs_columns: [player_id, "(pulls from multiple marts)"]
    answer_shape: "The lowest-entropy serve patterns by court side and pressure, with n, and the returner's win rate when the serve goes to the predicted spot; rally patterns named as unanswerable."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Partial (D8): serve patterns are answerable; rally patterns need fct_shots."
    fillers:
      - {"kind": "deep", "player": "Novak Djokovic"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "left_handed", "player": "Adrian Mannarino"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "the sample is thin (12 charted matches)"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}


  # ─────────────── SEMANTIC (pgvector) ───────────────
  - id: semantic-01
    question: "Which comebacks from a set and a break down turned on one high-leverage point, and who won that point?"
    category: semantic
    difficulty: sql+semantic
    marts: [fct_points, fct_games, mart_pressure_index]
    needs_columns: [match_id, note_text, embedding]
    answer_shape: "Matches won from a set and a break down, each with its highest-leverage point and its winner."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Comebacks come from the score, not text (D8). Leverage is for a typical server (D1); tiebreak points have none."

  # ─────────────── GUARDRAIL (negative case) ───────────────
  - id: guard-01
    question: "How fast (mph) does {player} serve on average?"
    category: guardrail
    difficulty: guardrail
    marts: []
    needs_columns: []
    answer_shape: "The agent should REFUSE: the Match Charting Project records serve direction/outcome, not speed. Offer the nearest answerable question (serve direction/effectiveness) instead."
    reference_sql: "N/A — data does not exist"
    expected: "A refusal + redirect. Any fabricated mph number is a FAIL."
    grounding: "the whole point: proves the agent won't hallucinate a plausible-but-unsupported number"
    fillers:
      - {"kind": "deep", "player": "Novak Djokovic"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  - id: guard-02
    question: "What is {player}'s injury risk this season, based on their workload?"
    category: guardrail
    difficulty: guardrail
    marts: []
    needs_columns: []
    answer_shape: "REFUSE: injuries and workload are not charted. Offer the closest answerable question (e.g. how many charted matches he played)."
    reference_sql: "N/A - data does not exist"
    expected: "A refusal + redirect. Any risk estimate is a FAIL."
    grounding: "sounds analytical, so it is a harder refusal than a future-prediction question"
    fillers:
      - {"kind": "original", "player": "Jannik Sinner"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  # ─────────────── SIGNATURE MARTS (added 2026-11-10) ───────────────
  # What only this warehouse can answer. Each was checked against the data
  # before it was added. persona: who would ask it.

  - id: sig-01
    persona: analyst
    question: "Which servers win a higher share of their highest-leverage service points than of their other service points?"
    category: pressure
    difficulty: multi-step
    marts: [mart_pressure_index]
    answer_shape: "Ranked servers: win rate on the highest-leverage service points vs their own overall service win rate, with n for both."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "leverage describes the score for a typical server on that tour and surface, not this server (D1). Tiebreak points have no leverage. A minimum n per server must be stated."

  - id: sig-02
    persona: analyst
    question: "Is break point really the highest-pressure point in tennis? Compare break points, deuce and game points by how much they swing the match."
    category: pressure
    difficulty: sql
    marts: [mart_pressure_index]
    answer_shape: "Mean leverage_index by pressure flag, with n, and the share of the top-leverage points that are not break points."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "leverage_index is normalised per tour (1.0 = an average point). Tiebreak points are excluded and must be named as excluded."

  - id: sig-03
    persona: scout
    question: "Which players in the 2024-2026 seasons play most like {player} did?"
    category: matchup
    difficulty: multi-step
    marts: [mart_player_style]
    answer_shape: "Nearest players (recent seasons) to Federer's career style vector, by distance over z-scored rates, per tour and surface, with matches."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "z-score within ATP hard-court cells only (T9: pooling tours put Ivanovic next to Federer). Exclude thin cells (under 20 matches). Name bh_slice_rate as the feature most likely to dominate."
    fillers:
      - {"kind": "original", "player": "Roger Federer"}
      - {"kind": "wta", "player": "Serena Williams"}
      - {"kind": "left_handed_deep", "player": "Rafael Nadal"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "Cazaux has 5 style cells: the comparison is thin"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  - id: sig-04
    persona: scout
    question: "How do right-handers change their play against left-handers, compared with their own baseline?"
    category: matchup
    difficulty: multi-step
    marts: [mart_matchup, dim_players]
    answer_shape: "Match-weighted mean delta per style rate, right-handers vs left-handed opponents, across the tour, with n."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Tour-wide so it can be taught. Deltas include opponent quality (mart_matchup description)."

  - id: sig-05
    persona: fan
    question: "Which opponent forces {player} furthest from their normal game, and does it cost them points?"
    category: matchup
    difficulty: sql
    marts: [mart_matchup]
    answer_shape: "Opponents ranked by the size of Alcaraz's style deltas, with his points-won rate against each and matches."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "Minimum 3 matches. Deltas include career change: show first_season and last_season."
    fillers:
      - {"kind": "original", "player": "Carlos Alcaraz"}
      - {"kind": "deep", "player": "Novak Djokovic"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "no opponent faced 3+ times: cannot be answered"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  - id: sig-06
    persona: analyst
    question: "How complete is the charting data for {player} in each season, and who charted most of it?"
    category: coverage
    difficulty: sql
    marts: [mart_data_coverage]
    answer_shape: "Per season: matches, direction_charted_rate, dominant_charter."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "the observation process has its own time series (T10). This is the question to ask before trusting any trend."
    fillers:
      - {"kind": "original", "player": "Carlos Alcaraz"}
      - {"kind": "cross_era", "player": "Roger Federer", "must_state": "seasons before 2010 are low parse confidence"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "thin", "player": "Arthur Cazaux", "must_state": "the sample is thin (12 charted matches)"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  # ─────────────── HONESTY TRAPS (added 2026-11-10) ───────────────
  # A correct answer MUST state the caveat. A clean number without it is a FAIL.

  - id: trap-01
    persona: analyst
    question: "Have rallies got longer since the 1990s?"
    category: rally
    difficulty: sql
    marts: [fct_points]
    answer_shape: "Mean rally length per decade, with parse_confidence per decade."
    reference_sql: "to write after review"
    expected: "Measured: 3.5-4.1 shots per decade since the 1980s, but every decade before 2010 is 'low' confidence (~55% parser accuracy)."
    grounding: "THE TRAP: comparing across charting eras. Must state that pre-2010 numbers are low confidence."

  - id: trap-02
    persona: fan
    question: "Does {player_a} win a higher share of long rallies than {player_b}?"
    category: rally
    difficulty: sql
    marts: [mart_rally_shape]
    answer_shape: "Each player's win_rate_slope, and why the slope, not the level, is the comparison."
    reference_sql: "to write after review"
    expected: "Measured slopes: Nadal +0.0105, Federer -0.0044."
    grounding: "THE TRAP: comparing win-rate LEVELS, which mostly reflect opponent quality (mart_rally_shape description)."
    fillers:
      - {"kind": "original", "player_a": "Rafael Nadal", "player_b": "Roger Federer", "must_state": "compare slopes, not levels (+0.0105 vs -0.0044)"}
      - {"kind": "wta", "player_a": "Iga Swiatek", "player_b": "Aryna Sabalenka", "must_state": "compare slopes, not levels"}
      - {"kind": "thin", "player_a": "Novak Djokovic", "player_b": "Arthur Cazaux", "must_state": "Cazaux's slope rests on few points"}
      - {"kind": "absent", "player_a": "Rafael Nadal", "player_b": "Teodor Vashkelny", "route": "sql", "must_state": "Vashkelny is not in the data; Nadal's slope alone (D8 rule 2)"}

  - id: trap-03
    persona: scout
    question: "What is {player}'s first-serve placement on {surface} in {season}?"
    category: serve
    difficulty: sql
    marts: [mart_player_style]
    answer_shape: "T share and entropy per court side, with n."
    reference_sql: "to write after review"
    expected: "2 charted matches in that cell."
    grounding: "THE TRAP: a thin sample. Must say 2 matches is too few to call a pattern."
    fillers:
      - {"kind": "original", "player": "Amanda Anisimova", "surface": "grass", "season": 2026, "must_state": "2 charted matches: too few for a pattern"}
      - {"kind": "thin", "player": "Alejandro Tabilo", "surface": "clay", "season": 2026, "must_state": "1 charted match: too few for a pattern"}
      - {"kind": "control", "player": "Jannik Sinner", "surface": "hard", "season": 2024, "must_state": "49 matches: no thin-sample caveat needed"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers", "surface": "grass", "season": 2026}

  - id: trap-04
    persona: analyst
    question: "Has {player} started hitting fewer inside-out forehands over their career?"
    category: direction
    difficulty: multi-step
    marts: [mart_player_style, mart_data_coverage]
    answer_shape: "fh_inside_out_rate per season and surface, beside direction_charted_rate and dominant_charter."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "THE TRAP: T10. The apparent decline sits inside a window where direction coverage fell .943 -> .797 as the dominant charter changed. Must not call it a trend."
    fillers:
      - {"kind": "original", "player": "Carlos Alcaraz"}
      - {"kind": "deep", "player": "Jannik Sinner"}
      - {"kind": "wta", "player": "Iga Swiatek"}
      - {"kind": "cross_era", "player": "Roger Federer", "must_state": "charting conventions changed across his career"}
      - {"kind": "absent", "player": "Teodor Vashkelny", "route": "refuse", "must_state": "the player is not in the data; no numbers"}

  - id: trap-05
    persona: scout
    question: "Does {player_a} handle pressure better than {player_b}, judging by the leverage index?"
    category: pressure
    difficulty: multi-step
    marts: [mart_pressure_index]
    answer_shape: "Each player's win rate on high-leverage points vs their own average, with n -- not their mean leverage_index."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "THE TRAP: leverage describes the score, not the player (D1). A player's mean leverage says how often they reached big points, not how they played them."
    fillers:
      - {"kind": "original", "player_a": "Jannik Sinner", "player_b": "Carlos Alcaraz"}
      - {"kind": "wta", "player_a": "Iga Swiatek", "player_b": "Aryna Sabalenka"}
      - {"kind": "deep", "player_a": "Novak Djokovic", "player_b": "Rafael Nadal"}

  - id: trap-06
    persona: analyst
    question: "Who has the best return game in the dataset?"
    category: serve
    difficulty: sql
    marts: [fct_points]
    answer_shape: "Return points won per player, with matches and a minimum n."
    reference_sql: "to write after review"
    expected: "to fill by running reference_sql"
    grounding: "THE TRAP: charted matches are not a random sample of tennis -- volunteers chart big matches and top players, so opponent quality differs by player. Must say so."

  # ─────────────── TEACH (added 2026-11-23, D10) ───────────────
  # Tour-level patterns a teaching coach can teach or a player can practise.
  # Each was checked against the data first; the headline is in `expected`.

  - id: teach-01
    persona: teaching coach
    question: "How much does winning the first point of a service game raise the chance of holding?"
    category: pressure
    difficulty: sql
    marts: [fct_points, fct_games]
    answer_shape: "Hold rate after winning vs losing the first point, per tour, with n."
    reference_sql: "to write after review"
    expected: "Measured: men 89.1% vs 63.2%, women 79.4% vs 48.6%."
    grounding: "Better servers win more first points, so part of the gap is selection, not cause. Must say so."

  - id: teach-02
    persona: teaching coach
    question: "Which second-serve placement wins the most points for pros, on each court side?"
    category: serve
    difficulty: sql
    marts: [fct_serves]
    answer_shape: "Win rate behind landed second serves by direction and court side, per tour, with n."
    reference_sql: "to write after review"
    expected: "Measured (men): ad-court T and deuce-court wide both 58.6%; body ~54.7%, the lowest."
    grounding: "A placement used less may win more partly BECAUSE it is used less. Not a rule to serve there every time."

  - id: teach-03
    persona: player
    question: "How many more points do pros win behind a first serve than behind a second serve?"
    category: serve
    difficulty: sql
    marts: [fct_points]
    answer_shape: "Points won on first-serve points vs second-serve points, per tour."
    reference_sql: "to write after review"
    expected: "Measured: men 72.1% vs 51.0%, women 63.8% vs 45.4%."
    grounding: "Point-level, so it includes the rally after the serve. Charted pro matches, not club level."

  - id: teach-04
    persona: teaching coach
    question: "What share of pro points end within the first four shots?"
    category: rally
    difficulty: sql
    marts: [fct_points]
    answer_shape: "Share of points with rally length 4 or fewer, per tour, with n."
    reference_sql: "to write after review"
    expected: "Measured: men 66.8%, women 65.6% (high+medium confidence)."
    grounding: "Rally length is parsed: use high+medium confidence only, and say so."

  - id: teach-05
    persona: player
    question: "Which scores matter most? How much more does winning the point at 30-30 matter than at 0-0?"
    category: pressure
    difficulty: sql
