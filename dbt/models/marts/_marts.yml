version: 2

# Column descriptions are PROMPT CONTEXT -- the agent reads them to write SQL.
# A column documented badly is a column used badly (lesson 003).

models:
  - name: fct_points
    description: >
      One row per point, with server, returner, handedness, pressure, rally
      shape and both serves resolved. The point-grain fact table the rest of the
      mart layer derives from. Both serves are carried side by side, so a
      faulted first serve is still visible -- but the grain is POINT, so use
      fct_serves for serve-grain questions.
    columns:
      - name: point_key
        description: Surrogate key over (match_id, point_number).
        data_tests: [not_null, unique]
      - name: server_name
        description: >
          Resolved name of the server. NULL for ~200 points whose match row is
          missing upstream.
      - name: returner_hand
        description: >
          R or L. Decides which physical corner a direction code names -- the
          spec defines direction relative to a RIGHT-HANDER's forehand side.
      - name: first_serve_direction
        description: "wide | body | T. NULL when the charter recorded no direction (permitted by the spec)."
      - name: first_serve_fault_type
        description: "net | wide | deep | wide_and_deep | foot_fault | shank | unknown. NULL if the first serve landed."
      - name: is_first_serve_in
        description: True when no second serve was needed.
      - name: played_serve_direction
        description: >
          Direction of the serve actually played -- the first if it landed,
          otherwise the second. Prefer first_serve_direction or
          second_serve_direction when the distinction matters.
      - name: pressure
        description: >
          break_point | game_point | deuce | neutral | unknown. Mutually
          exclusive, derived arithmetically from the score, not from a list of
          score strings. Break point means the RETURNER can win the game on this
          point.
        data_tests:
          - accepted_values:
              arguments:
                values: ['break_point', 'game_point', 'deuce', 'neutral', 'unknown']
          # Guard for errors E19: a tiebreak '0-1' or '0-0' used to half-parse as
          # a regular score and land in 'neutral'. 10,476 points did.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 'unknown'"
              config:
                where: "is_tiebreak_game"
      - name: is_tiebreak_game
        description: >
          True for every point of a tiebreak game, including its '0-0' point.
          Decided per GAME (any point failing the standard-score parse), because
          a single tiebreak score like '0-1' can half-parse as a regular one.
          Catches 7-point, short-set and match tiebreaks alike.
        data_tests: [not_null]
      - name: server_games_won
        description: Games the server has won in the current set, before this point.
      - name: returner_games_won
        description: Games the returner has won in the current set, before this point.
      - name: server_sets_won
        description: Sets the server has won before this one.
      - name: returner_sets_won
        description: Sets the returner has won before this one.
      - name: best_of
        description: >
          3 or 5, from upstream match metadata. NOT always consistent with the
          sets played -- 8 matches are labelled best-of-3 but play 4 or 5 sets.
          Check before using it to decide whether a match is over.
      - name: court_side
        description: "deuce | ad, derived from score parity. NULL on tiebreak points."
        data_tests:
          - accepted_values:
              arguments:
                values: ['deuce', 'ad']
              config:
                where: "court_side is not null"
      - name: parse_confidence
        description: >
          high (2020s) | medium (2010s) | low (pre-2010). Charting conventions
          drifted; never compare across tiers without saying so.

  - name: fct_serves
    description: >
      One row per serve struck, faults included. A point contributes one row if
      the first serve landed, two if it faulted. This is the grain every serve
      question actually has -- first-serve percentage is a filter here, not a
      ratio of ratios.
    columns:
      - name: serve_key
        description: Surrogate key over (point_key, serve_number).
        data_tests: [not_null, unique]
      - name: serve_number
        description: 1 or 2.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: serve_direction
        description: "wide | body | T. NULL when uncharted -- count() over this column is the honest denominator for any share."
      - name: landed
        description: True if the serve went in. False means a fault; two false rows on one point is a double fault.
      - name: fault_type
        description: "net | wide | deep | wide_and_deep | foot_fault | shank | unknown. NULL when the serve landed."

  - name: mart_serve_patterns
    description: >
      Pre-aggregated serve patterns, one row per (server, court_side, pressure,
      serve_number, parse_confidence). Shares, denominators and
      serve_direction_entropy are computed here once so the agent does not
      recompute them -- entropy in particular is easy to get subtly wrong.
      Reconciled against fct_serves by assert_serve_patterns_matches_fact.
      Serves with no resolvable server are excluded.
    columns:
      - name: serves
        description: All serves in this group, including those with no direction charted.
        data_tests: [not_null]
      - name: serves_with_direction
        description: >
          Serves with a direction charted. THIS is the denominator behind
          wide_share / body_share / t_share -- not `serves`. Report both when
          the gap matters.
      - name: direction_charted_rate
        description: serves_with_direction / serves. Low values mean the shares rest on a thin subset.
      - name: serve_direction_entropy
        description: >
          -SUM(p*ln p) over wide/body/T, normalised by ln(3) to [0,1]. 1.0 is a
          perfectly even three-way split (unreadable); 0.0 is every serve to the
          same spot. NULL when no direction was charted for the group.
      - name: directions_used
        description: >
          How many of the three directions appear at all. An entropy of 0 across
          one direction means something different from 0 across three.
      - name: landed_rate
        description: Share of these serves that went in. On serve_number = 1 this is first-serve percentage.
      - name: faults
        description: Serves in this group that missed. Denominator for the faults_* columns.
      - name: faults_net
        description: Faults into the net. A high share under pressure suggests decelerating on the swing.
      - name: faults_deep
        description: Faults long. A high share suggests over-hitting rather than tightening up.
      - name: faults_wide
        description: Faults wide of the box.
      - name: faults_wide_deep
        description: Faults both wide and long.

  - name: dim_players
    description: >
      One row per player. The agent's name-resolution table -- users say
      "Alcaraz", the marts key on "Carlos Alcaraz". A trigram index supports
      fuzzy lookup via the % operator and similarity(). Coverage columns exist
      so the agent can judge whether it has enough data to answer.
    columns:
      - name: player_name
        description: Canonical name as charted. Join key for every other mart.
        data_tests: [not_null, unique]
      - name: hand
        description: >
          R or L, resolved by majority vote across the player's matches.
          Charters mistype this; 49 players have disagreeing rows.
        data_tests:
          - accepted_values:
              arguments:
                values: ['R', 'L']
              config:
                where: "hand is not null"
      - name: is_hand_ambiguous
        description: True when charters disagreed about this player's handedness.
      - name: matches_charted
        description: Distinct matches. The first thing to check before trusting any rate about this player.
      - name: matches_2020s
        description: >
          Matches from 2020 onward, where the shot parser is ~90% accurate. A
          player with few of these has weaker parsed statistics than
          matches_charted suggests.
      - name: matches_pre_2010
        description: Matches before 2010, where parser agreement drops to ~55%.

  - name: fct_games
    description: >
      One row per game. The unit of a pressure episode -- points are too
      granular for "he got broken", matches too coarse. Sanity-checked against
      reality: men's hold rate 80.2%, women's 66.5%.
    columns:
      - name: game_key
        description: Surrogate key over (match_id, game_number).
        data_tests: [not_null, unique]
      - name: is_tiebreak
        description: >
          True for tiebreaks, where the server rotates every two points. 4,929
          tiebreaks; the server changes in all 4,928 that have player names, and
          in 1 of 291,357 regular games (noise). Effectively exact.
      - name: server_name
        description: NULL on tiebreaks -- there is no single server to credit.
      - name: held
        description: >
          True if the server won the game. NULL on tiebreaks rather than wrong.
          Filter `not is_tiebreak` for hold/break questions.
      - name: broken
        description: Inverse of held. NULL on tiebreaks.
      - name: game_winner_name
        description: >
          Winner of the game's last point, hence of the game. Meaningful on
          tiebreaks too, unlike held/broken. NULL for 50 games belonging to 2
          matches absent from the matches file upstream -- there are no player
          names to resolve. The same gap the stg_points relationships test warns
          about.
        data_tests:
          - not_null:
              config:
                # Scoped to games whose match row resolved. match_date is NULL
                # exactly when the match is missing upstream, so this asserts
                # the rule where it can hold instead of muting it everywhere.
                where: "match_date is not null"
      - name: break_points_faced
        description: Points in this game where the returner could win it.
      - name: max_deficit_faced
        description: >
          Largest point deficit the server faced. 3 means 0-40 or worse, so
          `max_deficit_faced >= 3` finds triple-break-point games.
      - name: reached_deuce
        description: True if the game reached 40-40 at any point.
      - name: set_number
        description: Which set of the match this game belongs to, starting at 1.

  - name: dim_charters
    description: >
      One row per volunteer charter. The dataset is crowdsourced and the charting
      spec makes shot direction, return depth and court position OPTIONAL, so
      charters differ systematically in how much detail they record -- direction
      coverage runs 0.00 to 0.93 across 196 charters. Every direction-based rate
      in the warehouse inherits that. NOT a quality ranking: the spec explicitly
      tells beginners to skip direction, so these rates describe depth of detail,
      not care.
    columns:
      - name: charter_name
        description: >
          `charted_by` as recorded upstream. '(unattributed)' where blank,
          though in practice every match currently carries a charter.
        data_tests: [not_null, unique]
      - name: matches_charted
        description: Distinct matches this charter recorded.
        data_tests: [not_null]
      - name: points_charted
        description: Points across those matches. The denominator for every rate below.
      - name: direction_charted_rate
        description: >
          Share of this charter's points where at least one shot carries a
          direction digit. Median is ~0.87; the useful outliers are high-volume
          charters well below it, whose matches dilute any direction metric.
      - name: return_depth_charted_rate
        description: >
          Share with a service-return depth digit (7/8/9). Return depth only ever
          applies to service returns, never to groundstrokes.
      - name: court_position_charted_rate
        description: >
          Share with an approach / at-net / net-cord / stop-volley modifier. The
          spec calls this the lowest-priority layer, so it is the sharpest signal
          of how thorough a charter is -- it varies fourfold.
      - name: uncharted_point_rate
        description: >
          Share of points recorded as S/R/P/Q -- outcome known, rally not charted.
      - name: charts_both_tours
        description: True when this charter has both ATP and WTA matches.

  - name: mart_data_coverage
    description: >
      What we know about a player, and how confidently -- the table to consult
      BEFORE answering, not after. questions.yml repeatedly requires "if N < 20
      say the sample is thin", which is only enforceable when sample size is a
      fact that can be looked up rather than a COUNT(*) the agent must remember
      to write. Emitted at four levels via GROUPING SETS so no re-aggregation is
      needed: rates cannot be averaged across rows without weighting, and
      `coverage_grain` says which level a row is. Counts sit beside every rate
      for consumers that do need to re-aggregate correctly.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_name, surface, season, coverage_grain]
    columns:
      - name: player_name
        description: Joins to dim_players.player_name.
        data_tests: [not_null]
      - name: coverage_grain
        description: >
          Which level this row summarises: player, player_surface, player_season
          or player_surface_season. Derived from GROUPING(), so a NULL in
          `surface` or `season` means "all of them", never "unknown".
        data_tests:
          - accepted_values:
              arguments:
                values: ['player', 'player_surface', 'player_season', 'player_surface_season']
      - name: surface
        description: NULL at the player and player_season grains, meaning all surfaces.
      - name: season
        description: Calendar year. NULL at the player and player_surface grains, meaning all years.
      - name: matches
        description: Distinct matches. Question 1 of 4 -- is there enough data at all?
        data_tests: [not_null]
      - name: opponents_faced
        description: >
          Distinct opponents. A high match count against few opponents is a
          different kind of thin than a low match count.
      - name: points
        description: Points the player was involved in. Denominator for the rates below.
      - name: direction_charted_rate
        description: >
          Question 2 of 4 -- is the field I need actually charted? Share of this
          player's points carrying a shot direction. Any down-the-line or
          crosscourt rate for this player has THIS as its real denominator.
      - name: return_depth_charted_rate
        description: Share carrying service-return depth.
      - name: court_position_charted_rate
        description: Share carrying an approach or net-position modifier.
      - name: high_confidence_rate
        description: >
          Question 3 of 4 -- can I trust the parse? Share of points from 2020+,
          where the shot parser agrees with the source author ~90% of the time
          versus ~55% pre-2010.
      - name: charters_involved
        description: >
          Question 4 of 4 -- is this one person's view? Distinct charters
          contributing. A player seen by one low-detail charter has thin
          direction data for reasons unrelated to the player.
      - name: dominant_charter
        description: >
          Most frequent charter for these matches. Join to dim_charters to see
          their completeness rates before trusting a direction-based claim.
      - name: points_uncharted
        description: Points whose outcome is known but whose rally was not recorded.

  - name: mart_rally_shape
    description: >
      Win rate by rally-length bucket, per player, with the slope precomputed.
      Reference data for T1 and questions.yml #3/#4. The LEVEL is mostly opponent
      quality -- elite players all sit near .53 -- so only the within-player slope
      is interpretable, and it is computed here in tested SQL precisely because an
      LLM handed bucket win rates will compare levels across players instead.
      Rates cover high+medium parse confidence only; rally length is parsed and is
      ~90% accurate on 2020s matches vs ~55% pre-2010.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_name, surface, shape_grain, rally_bucket]
    columns:
      - name: player_name
        description: Joins to dim_players.player_name.
        data_tests: [not_null]
      - name: shape_grain
        description: >
          'player' (all surfaces pooled) or 'player_surface'. From GROUPING SETS,
          so a NULL surface means all surfaces, never unknown.
        data_tests:
          - accepted_values:
              arguments:
                values: ['player', 'player_surface']
      - name: rally_bucket
        description: "Sackmann's buckets: 1-3, 4-6, 7-9, 10+ shots."
        data_tests: [not_null]
      - name: points
        description: >
          Points in this bucket at high or medium parse confidence -- the
          denominator for win_rate. Under ~20 the rate is not worth quoting.
      - name: points_low_confidence
        description: >
          Points excluded from the rates because the parse is pre-2010. Exposed so
          the omission is visible rather than silent.
      - name: win_rate
        description: Share of these points the player won.
      - name: share_of_points
        description: >
          This bucket's share of the player's points. A first-striker's mass sits
          in 1-3; a grinder's is flatter. Independent of win_rate and often the
          clearer style signal.
      - name: win_rate_slope
        description: >
          regr_slope(win_rate, bucket_ordinal) over the player's four buckets.
          NEGATIVE = wins more on short points (first-striker). POSITIVE = wins
          more on long ones (grinder). Read this, not the individual win rates,
          when comparing players. ALWAYS read it alongside slope_r2.
      - name: slope_r2
        description: >
          Goodness of fit for that slope. LOW R2 MEANS THE SLOPE IS MEANINGLESS --
          the player's pattern is not monotone and a line does not describe it.
          Federer is the cautionary case: slope -0.004 with r2 0.086, because his
          buckets run .5325 / .5518 / .5045 / .5335. Do not report a slope with r2
          below ~0.3 as a style claim.
      - name: buckets_with_20_plus
        description: >
          How many of the four buckets have >=20 points. Below 4, the slope is
          fitted on thin cells.

  - name: mart_pressure_index
    description: >
      One row per point with a leverage score: how much the server's chance of
      winning the MATCH swings on this point. Factorised as game_leverage x
      set_swing x match_swing, which is exact under the Markov structure of
      scoring. leverage_index is normalised so 1.0 = the average point on that
      tour. Point->game probabilities are PARAMETRIC: one point-win rate per
      (tour, surface), points assumed iid. So leverage describes the SCORE for a
      typical server on that tour and surface -- not this server, and not the
      kind of server who usually reaches this score. Say so when quoting it.
      Tiebreak points have NULL leverage in v1. Reads fct_points / fct_games
      only; no oracle involved, so no circularity.
    columns:
      - name: point_key
        description: Surrogate key over (match_id, point_number); joins to fct_points.
        data_tests: [not_null, unique]
      - name: is_tiebreak_game
        description: >
          True for tiebreak points, whose leverage is NULL in v1 -- the most
          important points in tennis are missing, and this column is how you
          cannot forget it.
        data_tests: [not_null]
      - name: game_leverage
        description: >
          P(server holds | wins point) - P(server holds | loses point). Highest
          at 30-40 and AD-out (identical by the deuce rule), lowest at 40-0.
          NULL on tiebreak points.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "game_leverage is not null"
      - name: set_swing
        description: >
          P(server wins set | holds this game) - P(... | broken), by games score.
          Advantage sets are folded past 5-5, since only the lead matters there.
      - name: match_swing
        description: >
          P(server wins match | wins this set) - P(... | loses it), by sets score
          and best_of. Exactly 1 in a deciding set. NULL where best_of contradicts
          the sets played.
        data_tests:
          # The test that would have caught the best_of bug: 1-1 in best-of-3
          # measured 0.9986 before inconsistent matches were excluded.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 1"
              config:
                where: >
                  (best_of = 3 and server_sets_won = 1 and returner_sets_won = 1)
                  or (best_of = 5 and server_sets_won = 2 and returner_sets_won = 2)
      - name: match_leverage
        description: >
          game_leverage x set_swing x match_swing. The absolute swing in match
          win probability. Use leverage_index to compare points.
      - name: leverage_index
        description: >
          match_leverage / tour mean. 1.0 = an average point. Per tour, because base hold rates differ (men ~.80,
          women ~.66) enough that a pooled mean distorts both.
      - name: hold_state_n
        description: Points behind the (tour, surface) point-win rate that hold_prob is derived from.
      - name: set_state_n
        description: Games behind the set_swing estimate. Small in deep advantage sets.
      - name: match_state_n
        description: Sets behind the match_swing estimate.

  - name: mart_player_style
    description: >
      One style vector per (player, season, surface). Rates plus the count each
      rate is computed over. NOT z-scored -- standardisation depends on the
      comparison population (T9: pooling ATP and WTA made Ivanovic Federer's
      nearest neighbour), so it belongs to the consumer. The vector describes
      HOW a player plays, not how well: no points-won or winner/error ratios.
      point_ending_rate is the one feature that also carries quality. Each
      concept appears once, because two correlated features weight that concept
      twice (T9 did this with slice). Shot mix and direction read Sackmann's
      ShotTypes / ShotDirection ORACLES, summed from leaf rows only. Allowed
      until fct_shots exists. After that this mart must read fct_shots, or the
      validation is circular. Serve and rally features are our parse. Cells
      under 20 matches are thin. They stay in the mart so the gap is visible.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_name, season, surface]
    columns:
      - name: player_name
        data_tests: [not_null]
      - name: season
        description: Calendar year of the match.
        data_tests: [not_null]
      - name: surface
        description: Part of the grain, never pooled -- surface mix confounds trends (T10).
        data_tests: [not_null]
      - name: matches
        description: Charted matches in the cell. Under 20 is thin (questions.yml).
      - name: fh_dominance
        description: >
          Forehand drives / (forehand + backhand drives). n = drives.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "fh_dominance is not null"
      - name: bh_slice_rate
        description: >
          Backhand slices / backhand-side shots. The one-hander proxy from T9. It measures style, not grip: Murray (two-hander) scores above Gasquet (one-hander). n = bh_side_shots.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "bh_slice_rate is not null"
      - name: net_rate
        description: >
          Net shots (volleys, overheads, half-volleys) / shots. n = shots.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "net_rate is not null"
      - name: drop_shot_rate
        description: >
          Drop shots / shots. n = shots.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "drop_shot_rate is not null"
      - name: point_ending_rate
        description: >
          Shots that end the point (winner, unforced error, or induced forced error) / shots. The first-strike signal. Also partly a quality measure. n = shots.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "point_ending_rate is not null"
      - name: fh_inside_out_rate
        description: >
          Forehand inside-out / forehand drives with a direction. n = fh_directed. Never divide by fh_directed + bh_directed.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "fh_inside_out_rate is not null"
      - name: fh_down_the_line_rate
        description: >
          Forehand down-the-line / forehand drives with a direction. n = fh_directed.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "fh_down_the_line_rate is not null"
      - name: bh_down_the_line_rate
        description: >
          Backhand down-the-line / backhand drives with a direction. n = bh_directed.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "bh_down_the_line_rate is not null"
      - name: first_serve_t_rate
        description: >
          First serves to the T / first serves with a direction and a court side. Faults included: the direction is where the server aimed. n = deuce_sided + ad_sided.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "first_serve_t_rate is not null"
      - name: deuce_serve_entropy
        description: >
          First-serve direction entropy on the deuce side. Same formula as mart_serve_patterns: 0 = always one direction, 1 = uniform. n = deuce_sided.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "deuce_serve_entropy is not null"
      - name: ad_serve_entropy
        description: >
          First-serve direction entropy on the ad side. n = ad_sided.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "ad_serve_entropy is not null"
      - name: first_serve_in_rate
        description: >
          First serves in / first serves. n = first_serves.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
              config:
                where: "first_serve_in_rate is not null"
      - name: avg_rally_length
        description: Mean rally length, high + medium parse confidence only. n = points_rally_scoreable.
      - name: fh_directed
        description: >
          Forehand drives with a direction charted. The denominator for every
          forehand direction rate. Direction is optional in the spec, so this
          count is not "forehands".
      - name: bh_directed
        description: >
          Backhand drives with a direction charted. The denominator for every
          backhand direction rate. Do not add it to fh_directed.
      - name: direction_charted_rate
        description: >
          Share of this cell's points with direction charted. A trend in a
          direction rate that moves with this column is suspect (T10).
