version: 2

# Column descriptions are PROMPT CONTEXT -- the agent reads them to write SQL.
# A column documented badly is a column used badly (lesson 003).

models:
  - name: fct_points
    description: >
      One row per point, with server, returner, handedness, pressure, rally
      shape and both serves resolved. The point-grain fact table the rest of the
      mart layer derives from. Both serves are carried side by side, so a
      faulted first serve is still visible -- but the grain is POINT, so use
      fct_serves for serve-grain questions.
    columns:
      - name: point_key
        description: Surrogate key over (match_id, point_number).
        data_tests: [not_null, unique]
      - name: server_name
        description: >
          Resolved name of the server. NULL for ~200 points whose match row is
          missing upstream.
      - name: returner_hand
        description: >
          R or L. Decides which physical corner a direction code names -- the
          spec defines direction relative to a RIGHT-HANDER's forehand side.
      - name: first_serve_direction
        description: "wide | body | T. NULL when the charter recorded no direction (permitted by the spec)."
      - name: first_serve_fault_type
        description: "net | wide | deep | wide_and_deep | foot_fault | shank | unknown. NULL if the first serve landed."
      - name: is_first_serve_in
        description: True when no second serve was needed.
      - name: played_serve_direction
        description: >
          Direction of the serve actually played -- the first if it landed,
          otherwise the second. Prefer first_serve_direction or
          second_serve_direction when the distinction matters.
      - name: pressure
        description: >
          break_point | game_point | deuce | neutral | unknown. Mutually
          exclusive, derived arithmetically from the score, not from a list of
          score strings. Break point means the RETURNER can win the game on this
          point.
        data_tests:
          - accepted_values:
              arguments:
                values: ['break_point', 'game_point', 'deuce', 'neutral', 'unknown']
      - name: court_side
        description: "deuce | ad, derived from score parity. NULL on tiebreak points."
        data_tests:
          - accepted_values:
              arguments:
                values: ['deuce', 'ad']
              config:
                where: "court_side is not null"
      - name: parse_confidence
        description: >
          high (2020s) | medium (2010s) | low (pre-2010). Charting conventions
          drifted; never compare across tiers without saying so.

  - name: fct_serves
    description: >
      One row per serve struck, faults included. A point contributes one row if
      the first serve landed, two if it faulted. This is the grain every serve
      question actually has -- first-serve percentage is a filter here, not a
      ratio of ratios.
    columns:
      - name: serve_key
        description: Surrogate key over (point_key, serve_number).
        data_tests: [not_null, unique]
      - name: serve_number
        description: 1 or 2.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: serve_direction
        description: "wide | body | T. NULL when uncharted -- count() over this column is the honest denominator for any share."
      - name: landed
        description: True if the serve went in. False means a fault; two false rows on one point is a double fault.
      - name: fault_type
        description: "net | wide | deep | wide_and_deep | foot_fault | shank | unknown. NULL when the serve landed."

  - name: mart_serve_patterns
    description: >
      Pre-aggregated serve patterns, one row per (server, court_side, pressure,
      serve_number, parse_confidence). Shares, denominators and
      serve_direction_entropy are computed here once so the agent does not
      recompute them -- entropy in particular is easy to get subtly wrong.
      Reconciled against fct_serves by assert_serve_patterns_matches_fact.
      Serves with no resolvable server are excluded.
    columns:
      - name: serves
        description: All serves in this group, including those with no direction charted.
        data_tests: [not_null]
      - name: serves_with_direction
        description: >
          Serves with a direction charted. THIS is the denominator behind
          wide_share / body_share / t_share -- not `serves`. Report both when
          the gap matters.
      - name: direction_charted_rate
        description: serves_with_direction / serves. Low values mean the shares rest on a thin subset.
      - name: serve_direction_entropy
        description: >
          -SUM(p*ln p) over wide/body/T, normalised by ln(3) to [0,1]. 1.0 is a
          perfectly even three-way split (unreadable); 0.0 is every serve to the
          same spot. NULL when no direction was charted for the group.
      - name: directions_used
        description: >
          How many of the three directions appear at all. An entropy of 0 across
          one direction means something different from 0 across three.
      - name: landed_rate
        description: Share of these serves that went in. On serve_number = 1 this is first-serve percentage.
      - name: faults
        description: Serves in this group that missed. Denominator for the faults_* columns.
      - name: faults_net
        description: Faults into the net. A high share under pressure suggests decelerating on the swing.
      - name: faults_deep
        description: Faults long. A high share suggests over-hitting rather than tightening up.
      - name: faults_wide
        description: Faults wide of the box.
      - name: faults_wide_deep
        description: Faults both wide and long.

  - name: dim_players
    description: >
      One row per player. The agent's name-resolution table -- users say
      "Alcaraz", the marts key on "Carlos Alcaraz". A trigram index supports
      fuzzy lookup via the % operator and similarity(). Coverage columns exist
      so the agent can judge whether it has enough data to answer.
    columns:
      - name: player_name
        description: Canonical name as charted. Join key for every other mart.
        data_tests: [not_null, unique]
      - name: hand
        description: >
          R or L, resolved by majority vote across the player's matches.
          Charters mistype this; 49 players have disagreeing rows.
        data_tests:
          - accepted_values:
              arguments:
                values: ['R', 'L']
              config:
                where: "hand is not null"
      - name: is_hand_ambiguous
        description: True when charters disagreed about this player's handedness.
      - name: matches_charted
        description: Distinct matches. The first thing to check before trusting any rate about this player.
      - name: matches_2020s
        description: >
          Matches from 2020 onward, where the shot parser is ~90% accurate. A
          player with few of these has weaker parsed statistics than
          matches_charted suggests.
      - name: matches_pre_2010
        description: Matches before 2010, where parser agreement drops to ~55%.

  - name: fct_games
    description: >
      One row per game. The unit of a pressure episode -- points are too
      granular for "he got broken", matches too coarse. Sanity-checked against
      reality: men's hold rate 80.2%, women's 66.5%.
    columns:
      - name: game_key
        description: Surrogate key over (match_id, game_number).
        data_tests: [not_null, unique]
      - name: is_tiebreak
        description: >
          True for tiebreaks, where the server rotates every two points. All
          4,928 tiebreaks in the data show a server change and no regular game
          does, so this detector is exact.
      - name: server_name
        description: NULL on tiebreaks -- there is no single server to credit.
      - name: held
        description: >
          True if the server won the game. NULL on tiebreaks rather than wrong.
          Filter `not is_tiebreak` for hold/break questions.
      - name: broken
        description: Inverse of held. NULL on tiebreaks.
      - name: game_winner_name
        description: >
          Winner of the game's last point, hence of the game. Meaningful on
          tiebreaks too, unlike held/broken. NULL for 50 games belonging to 2
          matches absent from the matches file upstream -- there are no player
          names to resolve. The same gap the stg_points relationships test warns
          about.
        data_tests:
          - not_null:
              config:
                # Scoped to games whose match row resolved. match_date is NULL
                # exactly when the match is missing upstream, so this asserts
                # the rule where it can hold instead of muting it everywhere.
                where: "match_date is not null"
      - name: break_points_faced
        description: Points in this game where the returner could win it.
      - name: max_deficit_faced
        description: >
          Largest point deficit the server faced. 3 means 0-40 or worse, so
          `max_deficit_faced >= 3` finds triple-break-point games.
      - name: reached_deuce
        description: True if the game reached 40-40 at any point.
      - name: set_number
        description: Which set of the match this game belongs to, starting at 1.
