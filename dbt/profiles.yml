# Checked in on purpose: every value comes from the environment, no secrets here.
# Point dbt at it with  --profiles-dir dbt  (the Makefile does this for you).
deuce:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'tennis') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'tennis') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'tennis') }}"
      schema: analytics
      threads: 4
