name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: tennis
  POSTGRES_USER: tennis
  POSTGRES_PASSWORD: tennis

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tennis
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tennis"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      # The schema has to apply cleanly before dbt can resolve its sources --
      # this catches a DDL/model mismatch without needing any data loaded.
      - name: Apply schema
        run: uv run deuce init-db

      # Loading the Definitions catches the whole class of orchestration errors
      # that `dbt build` cannot: a broken asset key, a stringified context
      # annotation, a missing resource. Cheap, and it runs before anything else
      # would notice.
      - name: Dagster definitions validate
        run: uv run dagster definitions validate

      - name: dbt parse + compile
        run: |
          uv run dbt deps --profiles-dir dbt --project-dir dbt
          uv run dbt compile --profiles-dir dbt --project-dir dbt

      # Once marts exist and a small fixture is seeded, this becomes the real
      # quality gate:
      #   uv run dbt build --profiles-dir dbt --project-dir dbt
